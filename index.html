<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNION AI</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #05070b;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .container {
        text-align: center;
        width: 100%;
        max-width: 500px;
        padding: 30px;
    }

    .title {
        font-size: 42px;
        font-weight: bold;
        letter-spacing: 8px;
        margin-bottom: 5px;
    }

    .subtitle {
        font-size: 12px;
        letter-spacing: 3px;
        opacity: .6;
        margin-bottom: 50px;
    }

    /* UNION symbol */

    .core {
        width: 230px;
        height: 230px;
        margin: auto;
        border: 2px solid #ffffff;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        animation: pulse 3s infinite ease-in-out;
    }

    .core::before {
        content: "";
        position: absolute;
        width: 180px;
        height: 180px;
        border: 1px solid #ffffff;
        border-radius: 50%;
        animation: spin 12s linear infinite;
    }

    .core::after {
        content: "★";
        font-size: 85px;
        position: absolute;
        animation: glow 2s infinite alternate;
    }

    .status {
        margin-top: 35px;
        font-size: 13px;
        letter-spacing: 3px;
        opacity: .7;
    }

    button {
        margin-top: 25px;
        padding: 18px 35px;
        border: 1px solid white;
        border-radius: 40px;
        background: transparent;
        color: white;
        font-size: 15px;
        font-weight: bold;
        letter-spacing: 2px;
        cursor: pointer;
        transition: .3s;
    }

    button:hover {
        background: white;
        color: black;
    }

    button:active {
        transform: scale(.95);
    }

    .message {
        margin-top: 30px;
        min-height: 30px;
        font-size: 15px;
        opacity: .8;
    }

    @keyframes pulse {
        0%,100% {
            transform: scale(1);
            box-shadow: 0 0 10px rgba(255,255,255,.1);
        }

        50% {
            transform: scale(1.04);
            box-shadow: 0 0 45px rgba(255,255,255,.25);
        }
    }

    @keyframes spin {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }

    @keyframes glow {
        from {
            opacity: .5;
            transform: scale(.95);
        }

        to {
            opacity: 1;
            transform: scale(1.08);
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="title">UNION</div>

    <div class="subtitle">
        UNITED INTELLIGENCE & OPERATIONS NETWORK
    </div>

    <div class="core"></div>

    <div class="status" id="status">
        SYSTEM READY
    </div>

    <button onclick="activateUnion()">
        TALK TO UNION
    </button>

    <div class="message" id="message"></div>

</div>

<script>

function activateUnion() {

    const status = document.getElementById("status");
    const message = document.getElementById("message");

    status.innerText = "LISTENING...";

    message.innerText = "UNION is ready.";

    if ("speechSynthesis" in window) {

        const speech = new SpeechSynthesisUtterance(
            "UNION online. How may I assist you?"
        );

        speech.rate = 0.9;
        speech.pitch = 0.8;

        speechSynthesis.speak(speech);

        speech.onend = function() {
            status.innerText = "SYSTEM READY";
        };

    } else {

        status.innerText = "VOICE UNAVAILABLE";
    }
}

</script>

</body>
</html>
